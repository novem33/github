<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>簡易範例</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      .card {
        max-width: 480px;
        margin: 80px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin-bottom: 12px;
      }

      p {
        line-height: 1.6;
      }

      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>你好，HTML！</h1>
      <p>這是一個簡單的 `範例.html` 頁面，你可以直接打開來查看效果。</p>
      <button onclick="showMessage()">點我</button>
    </div>

    <script>
      function showMessage() {
        alert('按鈕已被點擊！');
      }
    </script>
  </body>
</html>
